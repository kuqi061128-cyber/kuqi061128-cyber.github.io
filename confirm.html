<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>邮箱验证 - Kuqi's Web</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/assets/img/dsh.ico">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px; background: #0f172a; color: #e2e8f0; line-height: 1.75;
    font-family: "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif;
  }
  .card {
    width: min(520px, 100%); background: rgba(30, 41, 59, .65);
    border: 1px solid rgba(255,255,255,.08); border-radius: 14px; padding: 32px 28px;
    text-align: center;
  }
  .ico { font-size: 44px; line-height: 1; margin-bottom: 12px; }
  h1 { font-size: 20px; margin-bottom: 10px; }
  p { color: #94a3b8; font-size: 14px; margin-bottom: 6px; word-break: break-all; }
  .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 20px; }
  a.btn {
    font-size: 13px; text-decoration: none; color: #fff; padding: 9px 22px; border-radius: 999px;
    background: linear-gradient(135deg, #38bdf8, #818cf8);
  }
  a.btn.ghost { background: transparent; color: #94a3b8; border: 1px solid rgba(255,255,255,.12); }
  body[data-state="ok"] h1 { color: #6ee7b7; }
  body[data-state="err"] h1 { color: #fca5a5; }
  .spin { color: #94a3b8; font-size: 13px; }
</style>
</head>
<body>
  <div class="card">
    <div class="ico" id="ico">⏳</div>
    <h1 id="title">正在验证邮箱…</h1>
    <p id="msg">请稍候，不要关闭页面。</p>
    <div class="actions" id="actions" hidden>
      <a class="btn" href="/#/account">去登录</a>
      <a class="btn ghost" href="/">返回首页</a>
    </div>
  </div>

<script>
/* 邮箱验证落地页
   注册后邮件里的链接指向  https://kuqis.cloud/confirm.html?confirmation=<token>
   本页拿 token 调后端确认接口，再给用户明确结果。
   独立页面（不依赖主站脚本），因此不受 hash 路由影响。 */
(function () {
  var q = new URLSearchParams(location.search);
  var token = q.get("confirmation") || q.get("token") || "";
  var ico = document.getElementById("ico");
  var title = document.getElementById("title");
  var msg = document.getElementById("msg");
  var actions = document.getElementById("actions");

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function show(state, icon, t, m) {
    document.body.setAttribute("data-state", state);
    ico.textContent = icon;
    title.textContent = t;
    msg.innerHTML = m;
    actions.hidden = false;
  }

  if (!token) {
    show("err", "🧩", "链接不完整",
      "这个地址里没有验证参数。<br>如果你是从邮件点进来的，请完整复制邮件里的链接；" +
      "也可以回到「我的」页面重新发送验证邮件。");
    return;
  }

  fetch("/api/auth/email-confirmation?confirmation=" + encodeURIComponent(token), {
    headers: { Accept: "application/json" },
  })
    .then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (d) {
        return { ok: r.ok, status: r.status, d: d };
      });
    })
    .then(function (res) {
      if (res.ok) {
        show("ok", "✅", "邮箱验证成功", "你的账号已激活，现在可以登录了。");
        return;
      }
      var m = (res.d && res.d.error && res.d.error.message) || ("HTTP " + res.status);
      if (/already.*confirm|已被确认/i.test(m)) {
        show("ok", "✅", "这个邮箱已经验证过了", "你可以直接登录。");
      } else if (/expired|invalid|not found/i.test(m)) {
        show("err", "⌛", "验证链接已失效",
          "链接可能已过期或已被使用。<br>请回到「我的」页面，用同一邮箱重新发送验证邮件。");
      } else {
        show("err", "⚠️", "验证失败", esc(m));
      }
    })
    ["catch"](function () {
      show("err", "📡", "网络异常", "暂时连不上服务器，请稍后刷新本页重试。");
    });
})();
</script>
</body>
</html>

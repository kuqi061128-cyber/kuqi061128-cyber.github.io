<!DOCTYPE html>
<html lang="zh-CN" class="loading">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kuqi's Web</title>
<link rel="icon" href="assets/img/dsh.ico?v=2">
<!-- ======== SEO / 分享卡片（微信/QQ 抓取的是这里的静态值；日常改动在 site.js 的 url/description 同步） ======== -->
<link rel="canonical" href="https://kuqis.cloud/">
<meta name="description" content="Kuqi 的个人网站：分享教程、随笔、作品与下载。一位电子兴趣爱好者，无聊时就会捣鼓些莫名其妙的东西喵。">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Kuqi's Web">
<meta property="og:title" content="Kuqi's Web">
<meta property="og:description" content="Kuqi 的个人网站：分享教程、随笔、作品与下载。">
<meta property="og:url" content="https://kuqis.cloud/">
<meta property="og:image" content="https://kuqis.cloud/assets/background.jpg">
<meta name="twitter:card" content="summary">
<link rel="alternate" type="application/rss+xml" title="Kuqi 博客 RSS" href="rss.xml">
<!-- PWA：可安装到桌面 + 弱网离线（manifest 与 Service Worker 见根目录） -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f172a">
<link rel="apple-touch-icon" href="assets/img/icon-256.png">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0f172a;
    --card: rgba(30, 41, 59, var(--card-opacity, 0.65));  /* 半透明卡片：透明度由 site.js 的 cardOpacity 控制 */
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --accent2: #818cf8;
    --line: rgba(255,255,255,0.08);
    --pink: #f472b6;
    --bg-image: url("assets/background.jpg");
    --bg-dim: 0.6;                       /* 背景图压暗程度 0~1：越大图片越淡、文字越清楚 */
  }

  html { scroll-behavior: smooth; }

  html { background: var(--bg); }

  body {
    font-family: "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif;
    color: var(--text);
    line-height: 1.7;
  }

  /* 全屏固定背景图（站长在文件底部 SITE.background 配置）+ 压暗层，保证内容可读 */
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -2;
    background: var(--bg-image) center / cover no-repeat;
  }
  body::after {
    content: ""; position: fixed; inset: 0; z-index: -1;
    background: rgba(15, 23, 42, var(--bg-dim));
    pointer-events: none;
  }

  /* 动态背景视频（site.js 的 backgroundVideo 配置；未设置时隐藏，用静态背景图） */
  #bgVideo {
    position: fixed; inset: 0; z-index: -2; width: 100%; height: 100%;
    object-fit: cover; display: none;
  }

  a { color: var(--accent); }

  /* ================= 开场加载屏（页面加载完自动淡出） ================= */
  html.loading { overflow: hidden; }
  #loader {
    position: fixed; inset: 0; z-index: 300;
    background: #0f172a;
    display: flex; align-items: center; justify-content: center;
    transition: opacity .45s ease;
  }
  #loader.hide { opacity: 0; pointer-events: none; }
  .loader-box { width: min(320px, 78vw); text-align: center; }
  .loader-stage { position: relative; height: 96px; margin-bottom: 10px; }
  .loader-runner {
    position: absolute; bottom: 6px; left: 50%;
    width: 60px; height: 92px; object-fit: contain;
    transform: translateX(-50%);
    transform-origin: 50% 100%;
    animation: runBob .32s ease-in-out infinite alternate;
    filter: drop-shadow(0 3px 4px rgba(0,0,0,.45));
  }
  @keyframes runBob {   /* 静态素材的"奔跑感"：上下颠簸 + 前倾 */
    from { transform: translateX(-50%) translateY(0) rotate(6deg); }
    to   { transform: translateX(-50%) translateY(-7px) rotate(9deg); }
  }
  .loader-track {
    position: relative; height: 8px; border-radius: 4px;
    background: rgba(255,255,255,.1); overflow: visible;
  }
  .loader-fill {
    position: absolute; inset: 0 auto 0 0; width: 0%;
    border-radius: 4px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    transition: width .25s ease;
  }
  .loader-pct { margin-top: 12px; color: #94a3b8; font-size: 13px; letter-spacing: 2px; }
  @media (prefers-reduced-motion: reduce) { .loader-runner { animation: none; } }

  /* ================= 顶部导航（分区切换） ================= */
  nav {
    position: sticky; top: 0; z-index: 20;
    background: rgba(15, 23, 42, 0.75);
    border-bottom: 1px solid var(--line);
  }
  nav .nav-inner {
    max-width: 1280px; margin: 0 auto; padding: 0 20px;
    display: flex; justify-content: space-between; align-items: center;
    height: 60px; gap: 16px; flex-wrap: wrap;
  }
  .logo { font-weight: 700; font-size: 18px; white-space: nowrap; }
  .logo span { color: var(--accent); }
  .tabs { display: flex; gap: 6px; }
  .tab {
    color: var(--muted); text-decoration: none; font-size: 14px;
    padding: 6px 16px; border-radius: 999px; transition: .2s;
  }
  .tab:hover { color: var(--accent); background: rgba(56,189,248,.08); }
  .tab.active {
    color: #fff;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
  }

  /* ================= 三栏布局 ================= */
  .layout {
    max-width: 1280px; margin: 24px auto 40px; padding: 0 20px;
    display: grid;
    grid-template-columns: 280px minmax(0, 1fr) 280px;
    gap: 24px;
    align-items: start;
  }

  /* ---- 通用卡片 / 小工具 ---- */
  .widget {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 20px; margin-bottom: 20px;
  }

  /* 卡片磨砂程度由 site.js 的 cardBlur 控制。
     仅当 cardBlur > 0 时由 JS 给 <html> 加 .card-blur 类才启用 blur——
     blur(0px) 也会强制每个卡片建合成层采样背景，是首屏卡顿的元凶之一 */
  html.card-blur .widget, html.card-blur .banner, html.card-blur .post-card,
  html.card-blur .post-detail, html.card-blur .work-card {
    backdrop-filter: blur(var(--card-blur, 0px));
    -webkit-backdrop-filter: blur(var(--card-blur, 0px));
  }
  .widget-title {
    font-size: 15px; font-weight: 700; margin-bottom: 14px;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  .widget-title .ico { margin-right: 6px; }
  .widget-link { font-size: 12px; font-weight: 400; color: var(--muted); text-decoration: none; }
  .widget-link:hover { color: var(--accent); }

  /* ---- 左栏：时钟 ---- */
  .clock-date { color: var(--muted); font-size: 13px; }
  .clock-time {
    font-size: 34px; font-weight: 700; letter-spacing: 2px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .clock-hello { color: var(--muted); font-size: 13px; margin-top: 4px; }

  /* ---- 左栏：一言 ---- */
  .quote-text { font-size: 14px; color: var(--text); min-height: 66px; }
  .quote-from { color: var(--muted); font-size: 12px; text-align: right; margin-top: 8px; }

  /* ================= 中栏：内容区 ================= */
  /* 视图切换动画：整块内容淡入上移，卡片级子元素依次浮现（stagger） */
  .view-enter { animation: viewEnter .3s ease; }
  .view-enter > * { animation: viewFade .3s ease backwards; }
  .view-enter > *:nth-child(2) { animation-delay: .05s; }
  .view-enter > *:nth-child(3) { animation-delay: .1s; }
  .view-enter > *:nth-child(4) { animation-delay: .15s; }
  .view-enter > *:nth-child(n+5) { animation-delay: .2s; }
  @keyframes viewEnter { from { opacity: 0; transform: translateY(14px); } }
  @keyframes viewFade { from { opacity: 0; } }
  .view-head {
    display: flex; justify-content: space-between; align-items: center;
    gap: 12px; margin-bottom: 18px; flex-wrap: wrap;
  }
  .view-title { font-size: 22px; }
  .view-title::after {
    content: ""; display: block; width: 42px; height: 3px; margin-top: 6px;
    background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 2px;
  }
  .search-box { position: relative; }
  .search-box input {
    background: var(--card); border: 1px solid var(--line); border-radius: 999px;
    color: var(--text); font-family: inherit; font-size: 13px;
    padding: 8px 16px 8px 34px; outline: none; width: 220px;
  }
  .search-box input:focus { border-color: var(--accent); }
  .search-box::before {
    content: "🔍"; position: absolute; left: 12px; top: 50%;
    transform: translateY(-50%); font-size: 12px; opacity: .6;
  }

  /* ---- 首页横幅 ---- */
  .banner {
    background: linear-gradient(135deg, rgba(56,189,248,.18), rgba(129,140,248,.18)),
                rgba(30, 41, 59, .45);   /* 暗层打底，透出背景同时保证文字可读 */
    border: 1px solid rgba(56,189,248,.25); border-radius: 12px;
    padding: 28px; margin-bottom: 24px; display: flex; align-items: center; gap: 20px;
  }
  .banner .avatar {
    width: 72px; height: 72px; border-radius: 50%; flex: none;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex; align-items: center; justify-content: center;
    font-size: 28px; font-weight: 700; color: #fff;
  }
  .banner h2 { font-size: 20px; margin-bottom: 4px; }
  .banner p { color: var(--muted); font-size: 14px; }
  .banner .avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block; }
  .banner .site-intro { color: var(--muted); font-size: 13px; margin-top: 6px; max-width: 560px; }
  .banner .chips { margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    font-size: 12px; color: var(--accent); background: rgba(56,189,248,.1);
    border: 1px solid rgba(56,189,248,.25); border-radius: 999px; padding: 2px 12px;
  }

  .sec-head { display: flex; justify-content: space-between; align-items: baseline; margin: 26px 0 14px; }
  .sec-head h3 { font-size: 17px; }
  .sec-head a { font-size: 13px; color: var(--muted); text-decoration: none; }
  .sec-head a:hover { color: var(--accent); }

  /* ---- 文章卡片 ---- */
  /* 视口外的卡片/挂件跳过渲染，滚到附近才画（首屏布局绘制成本大降，auto 会记住真实高度不跳滚动） */
  .post-card, .work-card, .link-card, .col-left .widget, .col-right .widget {
    content-visibility: auto;
    contain-intrinsic-size: auto 200px;
  }
  .post-card {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 20px 22px; margin-bottom: 16px; transition: .2s;
  }
  .post-card:hover { border-color: rgba(56,189,248,.4); transform: translateY(-2px); }
  .post-card h4 { font-size: 17px; margin-bottom: 8px; }
  .post-card h4 a { color: var(--text); text-decoration: none; }
  .post-card h4 a:hover { color: var(--accent); }
  .post-meta {
    display: flex; gap: 14px; flex-wrap: wrap;
    color: var(--muted); font-size: 12px; margin-bottom: 10px;
  }
  .post-meta .cat {
    color: var(--accent); background: rgba(56,189,248,.1);
    padding: 0 10px; border-radius: 999px;
  }
  .post-sum { color: var(--muted); font-size: 14px; margin-bottom: 12px; }
  .read-more { font-size: 13px; text-decoration: none; }
  .read-more:hover { text-decoration: underline; }

  /* ---- 带封面的文章卡片（后台给文章设了 cover 时自动切换成左图右文） ---- */
  .post-card.has-cover { display: flex; gap: 16px; align-items: flex-start; }
  .pc-cover { flex: none; display: block; width: 96px; height: 96px; border-radius: 8px; overflow: hidden; }
  .pc-cover img {
    width: 100%; height: 100%; object-fit: cover; display: block;
    transition: transform .25s ease;
  }
  .post-card.has-cover:hover .pc-cover img { transform: scale(1.06); }
  .pc-body { flex: 1; min-width: 0; }
  @media (max-width: 780px) {
    .post-card.has-cover { gap: 12px; }
    .pc-cover { width: 76px; height: 76px; }
  }

  .filter-tag {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(56,189,248,.12); color: var(--accent);
    border-radius: 999px; padding: 3px 12px; font-size: 13px; margin-bottom: 14px;
  }
  .filter-tag a { text-decoration: none; color: inherit; }
  .empty { color: var(--muted); text-align: center; padding: 40px 0; font-size: 14px; }

  /* ---- 文章详情 ---- */
  .back-link { display: inline-block; color: var(--muted); font-size: 13px; text-decoration: none; margin-bottom: 16px; }
  .back-link:hover { color: var(--accent); }
  .post-detail {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 30px 32px;
  }
  .post-detail h1 { font-size: 26px; line-height: 1.4; margin: 10px 0 14px; }
  .post-content { margin-top: 18px; }
  .post-content p { margin-bottom: 14px; color: var(--text); font-size: 15px; }
  .post-content h3 {
    font-size: 17px; margin: 22px 0 10px; padding-left: 12px;
    border-left: 3px solid var(--accent);
  }
  .post-content img {
    max-width: 100%; display: block; border-radius: 8px;
    margin: 14px auto; border: 1px solid var(--line);
  }
  .post-tags { margin-top: 20px; display: flex; gap: 8px; flex-wrap: wrap; }
  .post-tags a {
    font-size: 12px; color: var(--muted); text-decoration: none;
    border: 1px solid var(--line); border-radius: 999px; padding: 2px 12px;
  }
  .post-tags a:hover { color: var(--accent); border-color: var(--accent); }

  /* ---- 作品详情 ---- */
  .work-hero {
    height: 200px; border-radius: 10px; margin-bottom: 18px;
    display: flex; align-items: center; justify-content: center; font-size: 72px;
    background-size: cover; background-position: center;
  }
  .dl-big {
    display: inline-block; margin: 10px 0 6px; padding: 12px 36px; border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff;
    text-decoration: none; font-size: 15px; transition: .2s;
  }
  .dl-big:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(56,189,248,.4); }

  /* ---- 网站推荐 ---- */
  .link-card {
    display: flex; gap: 14px; align-items: flex-start;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 16px; text-decoration: none; transition: .2s;
  }
  .link-card:hover { transform: translateY(-4px); border-color: rgba(56,189,248,.4); }
  .link-icon {
    width: 44px; height: 44px; border-radius: 10px; flex: none;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 20px; font-weight: 700;
  }
  .link-card .link-body { flex: 1; min-width: 0; }
  .link-card h4 { color: var(--text); font-size: 15px; margin-bottom: 4px; }
  .link-card p { color: var(--muted); font-size: 13px; margin-bottom: 8px; }
  .link-dom { color: var(--muted); font-size: 12px; }

  /* ---- 作品 ---- */
  .works-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 18px; }
  .work-card {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    overflow: hidden; transition: .2s;
  }
  .work-card:hover { transform: translateY(-4px); border-color: rgba(56,189,248,.4); }
  a.work-cover-link { display: block; text-decoration: none; }
  .work-cover {
    height: 110px; display: flex; align-items: center; justify-content: center;
    font-size: 40px;
    background-size: cover; background-position: center;
  }
  .work-body { padding: 14px 16px 16px; }
  .work-body h4 { font-size: 15px; margin-bottom: 6px; }
  .work-body h4 a { color: var(--text); text-decoration: none; }
  .work-body h4 a:hover { color: var(--accent); }
  .work-body p { color: var(--muted); font-size: 13px; margin-bottom: 10px; }
  .work-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 2px; }
  .work-tag {
    display: inline-block; font-size: 12px; color: var(--accent);
    background: rgba(56,189,248,.1); border-radius: 999px; padding: 1px 10px;
  }
  .work-dl {
    font-size: 12px; color: #fff; text-decoration: none; white-space: nowrap;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    padding: 4px 14px; border-radius: 999px; transition: .2s;
  }
  .work-dl:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(56,189,248,.4); }
  .dl-size { opacity: .85; font-size: 11px; }

  /* ---- 留言板（云端留言墙，数据存 Strapi Message 集合） ---- */

  /* ================= 右栏：统计类插件 ================= */
  .stat-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 7px 0; font-size: 13px; border-bottom: 1px dashed rgba(255,255,255,.06);
  }
  .stat-row:last-child { border-bottom: none; }
  .stat-row span:first-child { color: var(--muted); }
  .stat-row b { font-size: 15px; color: var(--accent); }

  .hot-list { list-style: none; }
  .hot-list li { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 10px; }
  .hot-rank {
    width: 20px; height: 20px; border-radius: 6px; flex: none; margin-top: 3px;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700; color: #fff; background: rgba(148,163,184,.35);
  }
  .hot-list li:nth-child(1) .hot-rank { background: #f87171; }
  .hot-list li:nth-child(2) .hot-rank { background: #fb923c; }
  .hot-list li:nth-child(3) .hot-rank { background: #facc15; color: #713f12; }
  .hot-list a { color: var(--text); text-decoration: none; font-size: 13px; line-height: 1.5; }
  .hot-list a:hover { color: var(--accent); }
  .hot-views { color: var(--muted); font-size: 11px; }

  .cat-row { margin-bottom: 12px; }
  .cat-row .cat-line { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px; }
  .cat-row .cat-line span:last-child { color: var(--muted); }
  .bar-track { height: 6px; border-radius: 3px; background: rgba(255,255,255,.07); overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--accent), var(--accent2)); }

  .cloud { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }
  .cloud a { color: var(--muted); text-decoration: none; transition: .15s; }
  .cloud a:hover { color: var(--accent); }

  /* ---- 提示气泡 ---- */
  .toast {
    position: fixed; left: 50%; bottom: 36px; transform: translateX(-50%) translateY(20px);
    background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff;
    padding: 10px 26px; border-radius: 999px; font-size: 14px;
    opacity: 0; pointer-events: none; transition: .3s; z-index: 50;
    box-shadow: 0 8px 24px rgba(0,0,0,.4);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  footer {
    text-align: center; padding: 28px 0; color: var(--muted);
    font-size: 13px; border-top: 1px solid var(--line);
  }

  /* ---- 主题切换按钮 ---- */
  .theme-btn {
    width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line);
    background: var(--card); color: var(--text); font-size: 15px; cursor: pointer;
    transition: .2s; flex: none; line-height: 1;
  }
  .theme-btn:hover { border-color: var(--accent); transform: rotate(15deg); }

  /* ---- 亮色主题（html[data-theme="light"] 时整套变量翻转为浅色） ---- */
  html[data-theme="light"] {
    --bg: #f1f5f9;
    --card: rgba(255, 255, 255, var(--card-opacity, 0.65));
    --text: #1e293b;
    --muted: #64748b;
    --accent: #0284c7;
    --accent2: #6366f1;
    --line: rgba(15, 23, 42, 0.12);
    --pink: #db2777;
  }
  html[data-theme="light"] body::after { background: rgba(241, 245, 249, var(--bg-dim)); }
  html[data-theme="light"] nav { background: rgba(255, 255, 255, .78); }
  html[data-theme="light"] .bp-body.img-full { background: rgba(255, 255, 255, .5); }

  /* ================= 文章目录 TOC ================= */
  .toc-box {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 14px 18px; margin: 4px 0 18px;
  }
  .toc-box > summary { cursor: pointer; font-size: 14px; font-weight: 700; user-select: none; }
  .toc-box > summary::-webkit-details-marker { display: none; }
  .toc-box .toc-n { color: var(--muted); font-weight: 400; font-size: 12px; }
  .toc-list { list-style: none; margin-top: 10px; }
  .toc-list li { margin-bottom: 6px; }
  .toc-list a { color: var(--muted); text-decoration: none; font-size: 13px; line-height: 1.6; }
  .toc-list a:hover { color: var(--accent); }
  .toc-list .toc-h3 { padding-left: 14px; }

  /* ================= 图片灯箱（原生 dialog） ================= */

<script>
window.DSH_CONTENT_READY.then(function () {
/* ================= 开场加载屏：小人随进度奔跑，真实加载完成即淡出 ================= */
(function () {
  var loader = document.getElementById("loader");
  if (!loader) return;
  var fill = document.getElementById("loaderFill"),
      pct = document.getElementById("loaderPct"),
      runner = loader.querySelector(".loader-runner");
  var p = 0, done = false;
  function setP(v) {
    p = Math.max(p, Math.min(100, v));
    fill.style.width = p + "%";
    pct.textContent = Math.round(p);
    runner.style.left = (8 + p * 0.84) + "%";   /* 小人在轨道 8%~92% 区间随进度前移 */
  }
  /* 快速起步 → 渐近逼近 90%，等内容就绪 + 首屏渲染完才冲 100 */
  (function tick() {
    if (done) return;
    setP(90 - (90 - p) * 0.92);
    setTimeout(tick, 120 + Math.random() * 180);
  })();
  function finish() {
    if (done) return;
    done = true;
    setP(100);
    setTimeout(function () {
      loader.classList.add("hide");
      document.documentElement.classList.remove("loading");
      setTimeout(function () { loader.remove(); }, 500);
    }, 380);
  }
  /* 本段已在 DSH_CONTENT_READY.then 内 → 内容数据已就绪。
     再等首屏渲染（mountPlugins/route 在本段之后同步执行）本轮结束后即放行，
     不再死等 window.load（它会被慢脚本/大资源拖住，假进度卡 90%）。load 仅作兜底。 */
  setTimeout(finish, 0);
  window.addEventListener("load", finish);   /* 资源提前 load 完也放行（幂等 done 守卫） */
  setTimeout(finish, 8000);   /* 保底：某资源卡死时 8 秒后也放行进站 */
})();

/* ================= 站点配置（在 site.js 文件里修改） ================= */
const SITE = Object.assign({
  name: "DSH",
  tagline: "",
  intro: "",
  avatar: "",
  background: "assets/background.png",
  backgroundDim: 0.6,
  footer: "© 2026 DSH 的博客 · 由 GitHub Pages 免费托管",
}, window.BLOG_SITE || {});

/* ================= 文章数据（存放在 content/posts/ 目录，一篇一个文件） ================= */
const ARTICLES = window.BLOG_POSTS || [];

/* ================= 作品数据（存放在 content/works.js） ================= */
const WORKS = window.BLOG_WORKS || [];

/* ================= 本地存储工具 ================= */
function storeGet(key, fallback) {
  try { const v = JSON.parse(localStorage.getItem(key)); return v === null || v === undefined ? fallback : v; }
  catch (e) { return fallback; }
}
function storeSet(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {} }

const state = {
  visits: 0,
  likes: storeGet("dsh_likes", 0),
  liked: storeGet("dsh_liked", false),
  viewExtra: storeGet("dsh_views", {}),   // 每篇文章的额外浏览量
  viewed: storeGet("dsh_viewed", {}),     // 本访客已计过浏览量的文章（每篇只计一次）
};

function articleViews(id) {
  const a = ARTICLES.find(x => x.id === id);
  return (a ? a.views : 0) + (state.viewExtra[id] || 0);
}

/* ================= 顶部 Logo ================= */
document.getElementById("logo").textContent = SITE.name;
document.title = SITE.name;
/* SEO meta 与 site.js 配置同步（<head> 里的静态值供不执行 JS 的爬虫，这里是给浏览器/执行 JS 的爬虫） */
(function () {
  const set = (sel, val) => { const m = document.querySelector(sel); if (m && val) m.setAttribute("content", val); };
  set('meta[name="description"]', SITE.description);
  set('meta[property="og:title"]', SITE.name);
  set('meta[property="og:site_name"]', SITE.name);
  set('meta[property="og:description"]', SITE.description);
  set('meta[property="og:url"]', SITE.url);
  const canon = document.querySelector('link[rel="canonical"]');
  if (canon && SITE.url) canon.setAttribute("href", SITE.url);
})();
/* 页脚（含 RSS 订阅入口）在启动段统一写入 —— 需等 esc 定义后再执行 */
document.documentElement.style.setProperty("--bg-image", 'url("' + SITE.background + '")');

if (SITE.cardOpacity != null) document.documentElement.style.setProperty("--card-opacity", String(SITE.cardOpacity));
/* 磨砂只在 >0 时启用：blur(0px) 也会给每个卡片强制建合成层采样背景，白白拖慢首屏 */
if (SITE.cardBlur > 0) {
  document.documentElement.classList.add("card-blur");
  document.documentElement.style.setProperty("--card-blur", SITE.cardBlur + "px");   /* 必须带 px，否则 blur(N) 非法整条失效 */
}
/* 视频背景体积大：移动端不加载（用静态背景图）；桌面端等页面加载完、
   再避开首屏交互期（load 后 + 空闲时机）才拉起，视频解码不和滚动/入场动画抢主线程 */
if (SITE.backgroundVideo) {
  var bgV = document.getElementById("bgVideo");
  if (window.matchMedia("(min-width: 781px)").matches) {
    var bgEnable = function () {
      bgV.src = SITE.backgroundVideo;
      bgV.style.display = "block";
      var bgPlay = bgV.play();
      if (bgPlay && bgPlay.catch) bgPlay.catch(function () {});
    };
    var bgStart = function () {
      setTimeout(function () {
        (window.requestIdleCallback || function (f) { setTimeout(f, 300); })(bgEnable);
      }, 800);

    if (document.readyState === "complete") bgStart();
    else window.addEventListener("load", bgStart);

    document.addEventListener("visibilitychange", function () {
      if (!bgV.src) return;
      if (document.hidden) bgV.pause();
      else { var p = bgV.play(); if (p && p.catch) p.catch(function () {}); }
    });
  }
}

/* ================= 工具函数 ================= */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

/* ================= HTML 白名单过滤（防投稿正文存储型 XSS） =================
 * 投稿正文 contentHtml 是访客输入，渲染前必须过滤：
 * 只保留排版类标签；<script>/<iframe>/表单控件等整段剔除；
 * 所有 on* 事件属性、javascript:/vbscript:/非图片 data: 链接全部剥掉。
 * 站长后台发布的内容同样过一遍，多一层保险，不影响正常排版。 */
const SAFE_TAGS = { P:1,BR:1,HR:1,H1:1,H2:1,H3:1,H4:1,H5:1,H6:1,
  STRONG:1,B:1,EM:1,I:1,U:1,S:1,DEL:1,INS:1,CODE:1,PRE:1,BLOCKQUOTE:1,
  UL:1,OL:1,LI:1,TABLE:1,THEAD:1,TBODY:1,TFOOT:1,TR:1,TH:1,TD:1,
  IMG:1,A:1,SPAN:1,DIV:1,FIGURE:1,FIGCAPTION:1,SUP:1,SUB:1,MARK:1 };

function sanitizeHtml(html) {
  const doc = new DOMParser().parseFromString(String(html || ""), "text/html");
  const root = document.createElement("div");
  const isBadUrl = u => /^\s*(javascript|vbscript):/i.test(u) ||
    (/^\s*data:/i.test(u) && !/^\s*data:image\//i.test(u));

  function cleanInto(parent, node) {
    if (node.nodeType === 3) { parent.appendChild(document.createTextNode(node.nodeValue)); return; }
    if (node.nodeType !== 1) return;                     // 注释等丢弃
    const tag = node.tagName;
    if (/^(SCRIPT|STYLE|IFRAME|OBJECT|EMBED|LINK|META|BASE|FORM|INPUT|BUTTON|SELECT|TEXTAREA|TEMPLATE|NOSCRIPT|SVG|MATH|AUDIO|VIDEO|SOURCE|TRACK)$/.test(tag)) return;
    if (!SAFE_TAGS[tag]) {                               // 白名单外标签：丢壳保内容
      Array.from(node.childNodes).forEach(c => cleanInto(parent, c));
      return;
    }
    const el = document.createElement(tag);
    if (tag === "IMG") {
      const src = node.getAttribute("src") || "";
      if (src && !isBadUrl(src)) {
        el.setAttribute("src", src);
        el.setAttribute("loading", "lazy");              // 顺手加上图片懒加载
      }
      if (node.getAttribute("alt")) el.setAttribute("alt", node.getAttribute("alt"));
    } else if (tag === "A") {
      const href = node.getAttribute("href") || "";
      if (href && !isBadUrl(href)) {
        el.setAttribute("href", href);
        if (/^https?:/i.test(href)) { el.setAttribute("target", "_blank"); el.setAttribute("rel", "noopener noreferrer"); }
      }
    }
    Array.from(node.childNodes).forEach(c => cleanInto(el, c));
    parent.appendChild(el);
  }
  Array.from(doc.body.childNodes).forEach(n => cleanInto(root, n));
  return root.innerHTML;
}

/* 图片路径解析：裸文件名 → 该作品/文章自己的文件夹；
   assets/ 开头、/ 开头、http(s) 链接原样保留 */
function resolveAsset(owner, path) {
  if (!path || /^(https?:|data:|\/\/)/i.test(path) || path.charAt(0) === "/" || path.indexOf("assets/") === 0) return path;
  return (owner && owner._dir ? owner._dir : "") + path;
}
function resolveDetailImgs(owner, html) {
  return String(html || "").replace(/(<img\b[^>]*\ssrc=")([^"]+)(")/g,
    (all, pre, src, post) => pre + resolveAsset(owner, src) + post);
}

/* ================= 纯文本工具（阅读时长 / 搜索索引 / 摘要片段） ================= */
function stripTags(html) {
  return String(html || "").replace(/<[^>]*>/g, " ")
    .replace(/&nbsp;/g, " ").replace(/&amp;/g, "&").replace(/&lt;/g, "<")
    .replace(/&gt;/g, ">").replace(/&quot;/g, '"').replace(/&#39;/g, "'")
    .replace(/\s+/g, " ").trim();
}

/* 预计阅读时长（分钟）：中文按字数、英文按词数 */
function readingMinutes(text) {
  const s = stripTags(text);
  const cjk = (s.match(/[\u4e00-\u9fa5]/g) || []).length;
  const words = (s.replace(/[\u4e00-\u9fa5]/g, " ").match(/[A-Za-z0-9]+/g) || []).length;
  return Math.max(1, Math.round(cjk / 400 + words / 220));
}

/* 目录：扫描 h2/h3 自动补 id 并生成折叠目录；标题少于 3 个不生成 */
function buildToc(root) {
  const hs = Array.from(root.querySelectorAll("h2, h3"));
  if (hs.length < 3) return { html: "", count: 0 };
  const items = hs.map(function (h, i) {
    if (!h.id) h.id = "sec-" + (i + 1);
    return { id: h.id, text: h.textContent.trim(), h3: h.tagName === "H3" };
  });
  return {

}

/* ================= 图片灯箱（原生 dialog，零依赖） ================= */
let lbEl = null, lbImgs = [], lbIdx = 0;

function lbShow() {
  const img = lbEl.querySelector(".lb-img");
  const cur = lbImgs[lbIdx];
  if (!cur) return;
  img.classList.add("loading");
  img.src = cur.currentSrc || cur.src;
  img.alt = cur.getAttribute("alt") || "";
  const multi = lbImgs.length > 1;
  lbEl.querySelector(".lb-prev").style.display = multi ? "" : "none";
  lbEl.querySelector(".lb-next").style.display = multi ? "" : "none";
  lbEl.querySelector(".lb-count").style.display = multi ? "" : "none";
  lbEl.querySelector(".lb-count").textContent = (lbIdx + 1) + " / " + lbImgs.length;
}

function lbGo(step) {
  if (lbImgs.length < 2) return;
  lbIdx = (lbIdx + step + lbImgs.length) % lbImgs.length;
  lbShow();
}

function lbBuild() {
  if (lbEl) return;
  const d = document.createElement("dialog");
  d.className = "lb";
  d.innerHTML =
    '<button type="button" class="lb-close" aria-label="关闭">✕</button>' +
    '<button type="button" class="lb-prev" aria-label="上一张">‹</button>' +
    '<img class="lb-img" alt="">' +
    '<button type="button" class="lb-next" aria-label="下一张">›</button>' +
    '<div class="lb-count"></div>';
  document.body.appendChild(d);
  lbEl = d;
  const img = d.querySelector(".lb-img");
  img.addEventListener("load", () => img.classList.remove("loading"));
  img.addEventListener("error", () => img.classList.remove("loading"));
  d.querySelector(".lb-close").addEventListener("click", () => d.close());
  d.querySelector(".lb-prev").addEventListener("click", () => lbGo(-1));
  d.querySelector(".lb-next").addEventListener("click", () => lbGo(1));
  d.addEventListener("click", function (e) { if (e.target === d) d.close(); });   // 点背景关闭
  d.addEventListener("close", function () { document.body.style.overflow = ""; });
  /* 键盘左右切换（Esc 由 dialog 原生处理） */
  document.addEventListener("keydown", function (e) {
    if (!lbEl || !lbEl.open) return;
    if (e.key === "ArrowLeft") lbGo(-1);
    else if (e.key === "ArrowRight") lbGo(1);
  });
}

function openLightbox(img) {
  lbBuild();
  const scope = img.closest(".post-content") || img.parentElement || mainView;
  lbImgs = Array.from(scope.querySelectorAll("img")).filter(x => x.getAttribute("src"));
  if (!lbImgs.length) return;
  lbIdx = Math.max(0, lbImgs.indexOf(img));
  lbShow();
  if (!lbEl.open) lbEl.showModal();
  document.body.style.overflow = "hidden";
}

/* ================= 代码块：复制按钮 + 轻量高亮 ================= */
function escTxt(s) {
  return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
}

/* 先整体转义，再对已转义文本着色 —— 保证任何内容都不会被当成标签执行 */
function highlightCode(raw, lang) {
  const L = String(lang || "").toLowerCase();
  const hashOk = /^(bash|sh|shell|zsh|python|py|yaml|yml|conf|ini)$/.test(L);
  const kw = /^(js|javascript|ts|typescript|json|html|xml|css|bash|sh|shell|python|py|java|c|cpp|go|rust|php|sql)$/.test(L);
  const rx = new RegExp(
    (hashOk ? "(^[ \\t]*#[^\\n]*)" : "(\\u0000)") +
    "|(\\/\\/[^\\n]*)|(\\/\\*[\\s\\S]*?\\*\\/)" +
    "|(\"(?:[^\"\\\\\\n]|\\\\.)*\"|'(?:[^'\\\\\\n]|\\\\.)*'|`(?:[^`\\\\]|\\\\.)*`)" +
    "|(\\b\\d+(?:\\.\\d+)?\\b)" +
    (kw ? "|(\\b(?:const|let|var|function|return|if|else|for|while|do|import|from|export|default|class|new|await|async|try|catch|finally|throw|typeof|instanceof|def|elif|lambda|print|echo|echo|fi|done|then|npm|node|git|cd|sudo|true|false|null|undefined)\\b)" : "(\\u0000)"),
    "gm");
  return escTxt(raw).replace(rx, function (m, hash, ln, blk, str, num, k) {
    if (hash) { if (hash === "\u0000") return m; return '<span class="tok-c">' + hash + "</span>"; }
    const cls = (ln || blk) ? "tok-c" : str ? "tok-s" : num ? "tok-n" : "tok-k";
    return '<span class="' + cls + '">' + m + "</span>";
  });
}

function legacyCopy(text) {
  try {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.top = "-1000px";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand("copy");
    ta.remove();
    return ok;
  } catch (e) { return false; }
}

function enhanceCodeBlocks(root) {
  Array.from(root.querySelectorAll("pre")).forEach(function (pre) {
    if (pre.dataset.enhanced) return;
    const code = pre.querySelector("code");
    const raw = (code || pre).textContent;
    const cls = (code && code.getAttribute("class")) || "";
    const mm = cls.match(/language-([\w-]+)/i);
    if (code && !code.dataset.hl) {
      code.dataset.hl = "1";
      try { code.innerHTML = highlightCode(raw, mm ? mm[1] : ""); } catch (e) {}
    }
    pre.dataset.enhanced = "1";
    pre.classList.add("code-block");
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "code-copy";
    btn.textContent = "复制";
    btn.title = "复制代码";
    btn.addEventListener("click", function () {
      const done = function (ok) {
        btn.textContent = ok ? "已复制 ✓" : "复制失败";
        setTimeout(function () { btn.textContent = "复制"; }, 1800);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(raw).then(function () { done(true); })
          ["catch"](function () { done(legacyCopy(raw)); });
      } else { done(legacyCopy(raw)); }
    });
    pre.appendChild(btn);
  });
}

/* ================= 搜索：正文索引 + 命中片段 ================= */
let textIndexBuilt = false;
function ensureTextIndex() {
  if (textIndexBuilt) return;
  textIndexBuilt = true;
  ARTICLES.forEach(function (a) {
    try { a._text = stripTags(sanitizeHtml(a.content)).toLowerCase(); } catch (e) { a._text = ""; }
  });
}

/* 把 text 中所有 kw 命中处包 <mark>，其余部分转义 */
function hilite(text, kw) {
  const s = String(text || "");
  if (!kw) return esc(s);
  const low = s.toLowerCase();
  let out = "", i = 0;
  while (i < s.length) {
    const p = low.indexOf(kw, i);
    if (p < 0) { out += esc(s.slice(i)); break; }
    out += esc(s.slice(i, p)) + '<mark class="hit">' + esc(s.slice(p, p + kw.length)) + "</mark>";
    i = p + kw.length;
  }
  return out;
}

/* 正文命中位置附近的摘要片段 */
function snip(a, kw) {
  const t = a._text || "";
  const i = t.indexOf(kw);
  if (i < 0) return "";
  const start = Math.max(0, i - 28);
  const end = Math.min(t.length, i + kw.length + 52);
  return (start > 0 ? "…" : "") + t.slice(start, end) + (end < t.length ? "…" : "");
}

/* 非详情页：把 og 标签重置为站点信息，并移除详情页留下的 JSON-LD
   （SPA 内从文章返回首页时，否则会残留上一篇文章的标题/描述） */
function resetSeo() {
  const set = function (sel, val) {
    const m = document.querySelector(sel);
    if (m && val) m.setAttribute("content", val);
  };
  set('meta[name="description"]', SITE.description);
  set('meta[property="og:type"]', "website");
  set('meta[property="og:title"]', SITE.name);
  set('meta[property="og:site_name"]', SITE.name);
  set('meta[property="og:description"]', SITE.description);
  set('meta[property="og:url"]', SITE.url || (location.origin + "/"));
  const setImg = document.querySelector('meta[property="og:image"]');
  if (setImg) setImg.setAttribute("content", siteBase() + "/assets/background.jpg");
  const ld = document.getElementById("dsh-jsonld");
  if (ld) ld.remove();
}

/* 详情页动态 SEO：og 标签 + JSON-LD 结构化数据（给执行 JS 的爬虫） */
function applyPostSeo(a) {
  const url = postShareUrl(a.id);
  const desc = a.summary || stripTags(a.content).slice(0, 120);
  const set = function (sel, val) {
    const m = document.querySelector(sel);
    if (m && val) m.setAttribute("content", val);
  };
  set('meta[name="description"]', desc);
  set('meta[property="og:type"]', "article");
  set('meta[property="og:title"]', a.title);
  set('meta[property="og:description"]', desc);
  set('meta[property="og:url"]', url);
  /* 分享卡片配图：文章有 cover 就用封面，否则回退站点背景图 */
  if (a.cover) set('meta[property="og:image"]', /^https?:/i.test(a.cover) ? a.cover : siteBase() + a.cover);

  let s = document.getElementById("dsh-jsonld");
  if (!s) {
    s = document.createElement("script");
    s.type = "application/ld+json";
    s.id = "dsh-jsonld";
    document.head.appendChild(s);
  }
  s.textContent = JSON.stringify({
    "@context": "https://schema.org",
    "@type": "Article",
    headline: a.title,
    datePublished: a.date,
    description: desc,
    articleSection: a.category || "",
    keywords: (a.tags || []).join(","),
    author: { "@type": "Person", name: SITE.ownerName || SITE.name },
    publisher: { "@type": "Organization", name: SITE.name },
    mainEntityOfPage: url,
  });
}

function mountPlugins() {
  const cols = { left: $("colLeft"), right: $("colRight") };
  BLOG_PLUGINS
    .filter(p => p.enabled !== false)
    .sort((a, b) => (a.order || 50) - (b.order || 50))
    .forEach(p => {
      const floating = p.column === "float";   // 浮动插件（如桌宠）：挂在 body 上，不进左右栏
      const host = floating ? document.body : (cols[p.column] || cols.left);
      const card = document.createElement("div");
      card.className = floating
        ? (p.className || "blog-pet")   // 浮动插件可自带类名（如阅读辅助），桌宠默认 blog-pet
        : "widget" + (p.className ? " " + p.className : "");
      card.dataset.plugin = p.id;
      host.appendChild(card);
      p._el = card;
      try {
        p.render(card, CTX);
        if (p.init) p.init(card, CTX);
      } catch (err) {
        card.innerHTML = '<div class="widget-title"><span><span class="ico">⚠️</span>插件 ' +
          esc(p.id) + ' 加载失败</span></div>';
      }
    });
}

function refreshPlugins() {
  BLOG_PLUGINS.forEach(p => {

}

/* ---- 详情页放大动画（FLIP）：点击卡片 → 详情从卡片原位放大展开 ---- */
let zoomSource = null;   // 记录被点击卡片的矩形，路由渲染详情时消费
mainView.addEventListener("click", function (e) {
  const a = e.target.closest('a[href^="#/"]');
  const card = e.target.closest(".post-card, .work-card");
  if (a && card) zoomSource = card.getBoundingClientRect();
}, true);

function playDetailZoom(el) {
  const from = zoomSource; zoomSource = null;
  if (!from || window.matchMedia("(prefers-reduced-motion: reduce)").matches) return false;
  const to = el.getBoundingClientRect();
  const sx = from.width / to.width, sy = from.height / to.height;
  if (!isFinite(sx) || !isFinite(sy) || sx <= 0 || sy <= 0) return false;
  const dx = (from.left + from.width / 2) - (to.left + to.width / 2);
  const dy = (from.top + from.height / 2) - (to.top + to.height / 2);
  el.style.transformOrigin = "50% 50%";
  el.style.transform = "translate(" + dx + "px," + dy + "px) scale(" + sx + "," + sy + ")";
  el.style.opacity = "0.5";
  el.getBoundingClientRect();   // 强制回流，确保起始状态生效
  el.style.transition = "transform .38s cubic-bezier(.22,.61,.36,1), opacity .38s ease";
  el.style.transform = "";
  el.style.opacity = "";
  const done = () => { el.style.transition = ""; el.removeEventListener("transitionend", done); };
  el.addEventListener("transitionend", done);
  setTimeout(done, 500);
  return true;
}

/* ---- 文章列表（分页 + 正文搜索） ---- */
let articleKeyword = "";
let articlePage = 1;
const ARTICLE_PAGE_SIZE = 10;

function filterArticles(tagFilter) {
  const kw = articleKeyword.trim().toLowerCase();
  if (kw) ensureTextIndex();          // 正文索引惰性构建，首屏不受影响
  return ARTICLES.filter(a =>
    (!tagFilter || (a.tags || []).includes(tagFilter) || a.category === tagFilter) &&
    (!kw || a.title.toLowerCase().includes(kw) ||
      String(a.summary || "").toLowerCase().includes(kw) ||
      (a.tags || []).join(",").toLowerCase().includes(kw) ||
      String(a.category || "").toLowerCase().includes(kw) ||
      String(a._text || "").includes(kw))
  ).sort((a, b) => String(b.date).localeCompare(String(a.date)));
}

function articleCardsHtml(list, kw) {
  return list.map(a => postCard(a, kw)).join("");
}

function renderArticleMore(list, kw) {
  const box = $("articleMore");
  if (!box) return;
  const shown = Math.min(articlePage * ARTICLE_PAGE_SIZE, list.length);
  const left = list.length - shown;
  box.innerHTML =
    '<div class="list-count">已显示 ' + shown + " / " + list.length + " 篇</div>" +
    (left > 0 ? '<button type="button" class="load-more">加载更多（还有 ' + left + " 篇）</button>" : "");
  const btn = box.querySelector(".load-more");
  if (!btn) return;
  btn.addEventListener("click", function () {
    articlePage++;
    const cards = $("articleCards");
    if (cards) {
      cards.insertAdjacentHTML("beforeend",
        articleCardsHtml(list.slice((articlePage - 1) * ARTICLE_PAGE_SIZE, articlePage * ARTICLE_PAGE_SIZE), kw));
    }
    renderArticleMore(list, kw);
  });
}

function renderArticleList(tagFilter) {
  const box = $("articleListBox");
  if (!box) return;
  const kw = articleKeyword.trim().toLowerCase();
  const list = filterArticles(tagFilter);
  articlePage = 1;
  if (!list.length) {
    box.innerHTML = '<div class="empty">没有找到符合条件的文章</div>';
    return;
  }
  box.innerHTML = '<div id="articleCards">' + articleCardsHtml(list.slice(0, ARTICLE_PAGE_SIZE), kw) + "</div>" +
    '<div id="articleMore" class="list-more"></div>';

}

/* ---- 相关文章：按标签重合度 + 同分类打分 ---- */
function relatedPosts(a, n) {
  const tags = a.tags || [];
  return ARTICLES.filter(x => x.id !== a.id).map(function (x) {
    let score = 0;
    (x.tags || []).forEach(function (t) { if (tags.indexOf(t) > -1) score += 2; });
    if (x.category && x.category === a.category) score += 1;
    return { a: x, score: score };
  }).filter(x => x.score > 0)
    .sort((p, q) => q.score - p.score || String(q.a.date).localeCompare(String(p.a.date)))
    .slice(0, n).map(x => x.a);
}

function renderPost(id) {
  const a = ARTICLES.find(x => x.id === id);
  if (!a) { renderArticles(); return; }
  if (!state.viewed[id]) {          // 每访客每篇只计一次，反复刷新不刷浏览量
    state.viewed[id] = true;
    state.viewExtra[id] = (state.viewExtra[id] || 0) + 1;
    storeSet("dsh_views", state.viewExtra);
    storeSet("dsh_viewed", state.viewed);
  }
  refreshPlugins();

  /* 上/下一篇（按日期升序排列后取相邻） */
  const sorted = ARTICLES.slice().sort((x, y) => String(x.date).localeCompare(String(y.date)));
  const idx = sorted.findIndex(x => x.id === id);
  const prev = idx > 0 ? sorted[idx - 1] : null;
  const next = (idx > -1 && idx < sorted.length - 1) ? sorted[idx + 1] : null;
  const navHtml = '<nav class="post-nav">' +
    (prev
      ? '<a class="pn-item" href="#/post/' + prev.id + '"><span class="pn-label">← 上一篇</span><span class="pn-title">' + esc(prev.title) + "</span></a>"
      : '<span class="pn-item pn-off"><span class="pn-label">← 上一篇</span><span class="pn-title">已经是第一篇了</span></span>') +
    (next
      ? '<a class="pn-item pn-right" href="#/post/' + next.id + '"><span class="pn-label">下一篇 →</span><span class="pn-title">' + esc(next.title) + "</span></a>"
      : '<span class="pn-item pn-right pn-off"><span class="pn-label">下一篇 →</span><span class="pn-title">已经是最后一篇了</span></span>') +
    "</nav>";

  /* 相关文章 */
  const rel = relatedPosts(a, 3);
  const relHtml = rel.length
    ? '<div class="related-box"><div class="widget-title"><span><span class="ico">🔗</span>相关文章</span></div>' +
      rel.map(x => '<a class="related-item" href="#/post/' + x.id + '">' +
        '<span class="ri-title">' + esc(x.title) + "</span>" +
        '<span class="ri-meta">' + esc(x.date) + " · " + esc(x.category || "") + "</span></a>").join("") +
      "</div>"
    : "";

  mainView.innerHTML =
    '<a class="back-link" href="#/articles">← 返回文章列表</a>' +
    '<article class="post-detail">' +
    '<div class="post-meta"><span class="cat">' + esc(a.category) + '</span>' +
    '<span>📅 ' + a.date + '</span><span>👀 ' + articleViews(id) + ' 浏览</span>' +
    '<span>⏱ 约 ' + readingMinutes(a.content) + ' 分钟</span>' +
    (a.authorName ? '<span>✍️ ' + esc(a.authorName) + '</span>' : '') + '</div>' +
    '<h1>' + esc(a.title) + '</h1>' +
    '<div class="post-content">' + resolveDetailImgs(a, sanitizeHtml(a.content)) + '</div>' +
    '<div class="post-tags">' + (a.tags || []).map(t =>
      '<a href="#/articles/tag/' + encodeURIComponent(t) + '">#' + esc(t) + '</a>').join("") + '</div>' +
    shareBar("post", id, a.title) +
    navHtml +
    relHtml +
    '</article>' +
    '<div id="cmtBox"></div>';

  /* 目录：内容入 DOM 后再扫描标题生成，插在正文之前 */
  const pc = mainView.querySelector(".post-content");
  if (pc) {
    const toc = buildToc(pc);
    if (toc.html) pc.insertAdjacentHTML("beforebegin", toc.html);
  }
  enhanceCodeBlocks(mainView);
  applyPostSeo(a);
  if (window.DSH_COMMENTS) window.DSH_COMMENTS.mount($("cmtBox"), "post", id);
}

/* ---- 作品 ---- */
function renderWorks() {
  const loggedIn = window.DSH_AUTH && window.DSH_AUTH.user();
  const contributeBtn = loggedIn
    ? '<a href="#/account" style="font-size:13px;text-decoration:none;color:var(--accent);' +
      'border:1px solid rgba(56,189,248,.35);border-radius:999px;padding:4px 14px">＋ 我要投稿</a>'
    : '';
  mainView.innerHTML =
    '<div class="view-head"><h2 class="view-title">🚀 我的作品</h2>' + contributeBtn + '</div>' +
    '<div class="works-grid">' + WORKS.map(workCard).join("") + '</div>';
}

/* ---- 作品详情 ---- */
function renderWork(id) {
  const w = WORKS.find(x => x.id === id);
  if (!w) { renderWorks(); return; }
  const meta = ['<span class="cat">' + esc(w.tag) + '</span>'];
  if (w.version) meta.push('<span>🔖 ' + esc(w.version) + '</span>');
  if (w.date) meta.push('<span>📅 ' + esc(w.date) + '</span>');
  if (w.size) meta.push('<span>📦 ' + esc(w.size) + '</span>');
  if (w.authorName) meta.push('<span>👤 ' + esc(w.authorName) + '</span>');
  const dl = w.file
    ? '<a class="dl-big" href="' + esc(w.file) + '"' +
      (/^https?:/i.test(w.file) ? ' target="_blank" rel="noopener"' : ' download') +
      '>⬇ 立即下载' + (w.version ? ' ' + esc(w.version) : '') + '</a>' +
      '<div class="post-meta" style="margin:4px 0 0;">' +
      (/^https?:/i.test(w.file) ? '<span>外部链接，将在新窗口打开</span>' : '<span>文件位置：' + esc(w.file) + '</span>') + '</div>'
    : '';
  mainView.innerHTML =
    '<a class="back-link" href="#/works">← 返回作品列表</a>' +
    '<article class="post-detail">' +
    '<div class="work-hero" style="' + (w.coverImg
      ? "background-image:url('" + resolveAsset(w, w.coverImg) + "')"
      : "background:" + w.cover) + '">' + (w.coverImg ? "" : w.emoji) + '</div>' +
    '<h1>' + esc(w.title) + '</h1>' +
    '<div class="post-meta">' + meta.join("") + '</div>' +
    dl +
    '<div class="post-content"><p>' + esc(w.desc) + '</p>' + resolveDetailImgs(w, sanitizeHtml(w.detail)) + '</div>' +
    shareBar("work", id, w.title) +
    '</article>' +
    '<div id="cmtBox"></div>';
  enhanceCodeBlocks(mainView);
  if (window.DSH_COMMENTS) window.DSH_COMMENTS.mount($("cmtBox"), "work", id);
}

/* ---- 404 兜底页 ---- */
function renderNotFound(bad) {
  setActiveTab("");
  mainView.innerHTML =
    '<article class="post-detail"><div class="nf-box">' +
    '<div class="nf-code">404</div>' +
    '<h1 style="font-size:20px;margin:12px 0 8px">页面不存在</h1>' +
    '<p style="color:var(--muted);font-size:14px">你访问的地址可能已失效或输入有误。' +
    (bad ? '<br>你输入的是：<code style="font-size:13px">#/' + esc(bad) + "</code>" : "") + "</p>" +
    '<div class="nf-actions">' +
    '<a class="share-btn" href="#/home">返回首页</a>' +
    '<a class="share-btn" href="#/articles">浏览文章</a>' +
    '<a class="share-btn" href="#/board">去留言板反馈</a>' +
    "</div></div></article>";
}

/* ---- 扩展分区（views/ 目录注册的模块，如留言板）由路由统一分发 ---- */

/* ================= Hash 路由 ================= */
function setActiveTab(view) {
  document.querySelectorAll(".tab").forEach(t =>
    t.classList.toggle("active", t.dataset.view === view));
}

/* 每个路由独立页面标题（浏览器标签页 / 收藏 / 历史记录里能看到具体页名） */
function setPageTitle(sub) {
  document.title = sub ? sub + " - " + SITE.name : SITE.name;
}

/* 滚动位置记忆：从列表进详情、再返回列表时恢复原位 */
let prevViewKey = null, prevViewList = false, prevViewDetail = false;
let lastListViewKey = null, lastListScroll = 0;

function route() {
  const hash = location.hash.replace(/^#\/?/, "");
  const parts = hash.split("/").filter(Boolean).map(decodeURIComponent);
  const view = parts[0] || "home";
  const isDetail = (view === "post" || view === "work") && parts[1];
  const isList = !isDetail;
  const viewKey = isDetail ? view + "/" + parts[1] : (hash || "home");
  /* 离开列表页的那一刻记下滚动位置（此时页面还没被新内容替换） */
  if (prevViewList && prevViewKey) {
    lastListViewKey = prevViewKey;
    lastListScroll = window.scrollY || 0;
  }
  articleKeyword = "";
  resetSeo();          // 先重置为站点默认，文章详情页稍后会重新写入自己的 og/JSON-LD
  let zoomed = false;
  const tryZoom = () => {   // 详情页：尝试从被点卡片的位置放大展开
    const detail = mainView.querySelector(".post-detail, .work-detail");
    if (detail && zoomSource && playDetailZoom(detail)) { zoomed = true; return; }
    zoomSource = null;
  };
  if (view === "post" && parts[1]) {
    setActiveTab("articles"); renderPost(Number(parts[1]));
    const a = ARTICLES.find(x => x.id === Number(parts[1]));
    setPageTitle(a ? a.title : "文章");
  }
  else if (view === "articles") {
    setActiveTab("articles");
    const tag = parts[1] === "tag" ? parts[2] : null;
    renderArticles(tag);
    setPageTitle(tag ? "标签：" + tag : "全部文章");
  }
  else if (view === "work" && parts[1]) {
    setActiveTab("works"); renderWork(Number(parts[1]));
    const w = WORKS.find(x => x.id === Number(parts[1]));
    setPageTitle(w ? w.title : "作品");
  }
  else if (view === "works") { setActiveTab("works"); renderWorks(); setPageTitle("我的作品"); }
  else {
    const sec = BLOG_SECTIONS.find(s => s.id === view);
    if (sec) { setActiveTab(sec.id); sec.render(mainView, CTX); setPageTitle(sec.label); }
    else if (view === "home" || hash === "") { setActiveTab("home"); renderHome(); setPageTitle(null); }
    else { renderNotFound(hash); setPageTitle("页面不存在"); }   // 未知地址 → 404 兜底页
  }

  /* 滚动位置：从详情返回同一个列表页时恢复原位，其余情况回顶部 */
  if (isList && prevViewDetail && viewKey === lastListViewKey && lastListScroll > 0) {
    const y = lastListScroll;
    requestAnimationFrame(() => window.scrollTo(0, y));
  } else {
    window.scrollTo(0, 0);
  }
  tryZoom();   // 滚动到顶后再取详情最终位置，从卡片矩形放大过来
  /* 视图切换动画：放大动画已播放就不再叠加整页位移（避免双重动作） */
  mainView.classList.remove("view-enter");
  if (!zoomed) { void mainView.offsetWidth; mainView.classList.add("view-enter"); }
  prevViewKey = viewKey;
  prevViewList = !!isList;
  prevViewDetail = !!isDetail;
}

window.addEventListener("hashchange", route);

/* ================= 顶部导航：内置分区 + views/ 扩展分区自动生成 ================= */
function renderNavTabs() {
  const items = [
    { id: "home", label: "首页", order: 10 },
    { id: "articles", label: "文章", order: 20 },
    { id: "works", label: "作品", order: 30 },
  ].concat(BLOG_SECTIONS)
   .sort((a, b) => (a.order || 50) - (b.order || 50));
  $("navTabs").innerHTML = items.map(i =>
    '<a class="tab" data-view="' + i.id + '" href="#/' + i.id + '">' + i.label + '</a>').join("");
}

/* ================= 亮/暗主题切换（选择存访客本地，默认暗色） ================= */
function applyTheme(t) {
  document.documentElement.setAttribute("data-theme", t);
  const btn = $("themeBtn");
  if (btn) {
    btn.textContent = t === "light" ? "🌙" : "☀️";
    btn.title = t === "light" ? "切换到暗色主题" : "切换到亮色主题";
  }
}
let theme = storeGet("dsh_theme", "dark");
applyTheme(theme);
$("themeBtn").addEventListener("click", function () {
  theme = theme === "light" ? "dark" : "light";
  storeSet("dsh_theme", theme);
  applyTheme(theme);
});

/* ================= 全局事件委托：目录跳转 / 图片灯箱 / 复制链接 ================= */
mainView.addEventListener("click", function (e) {
  const toc = e.target.closest("[data-toc]");
  if (toc) {   // 目录跳转：平滑滚动，且不破坏 hash 路由
    e.preventDefault();
    const t = document.getElementById(toc.dataset.toc);
    if (t) t.scrollIntoView({ behavior: "smooth", block: "start" });
    return;
  }
  const sh = e.target.closest('[data-share="copy"]');
  if (sh) {
    const url = sh.dataset.url || location.href;
    const title = sh.dataset.title || document.title;
    if (navigator.share && /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) {
      navigator.share({ title: title, url: url })["catch"](function () {});
      return;
    }
    const done = ok => toast(ok ? "链接已复制" : "复制失败，请手动复制地址栏");
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(() => done(true))["catch"](() => done(legacyCopy(url)));
    } else { done(legacyCopy(url)); }
    return;
  }
  const img = e.target.closest(".post-content img");
  if (img) { e.preventDefault(); openLightbox(img); }
});

/* ================= 启动 ================= */
/* 页脚：文案来自 site.js，末尾补 RSS 订阅入口 */
document.getElementById("siteFooter").innerHTML =
  esc(SITE.footer) + ' · <a href="rss.xml" title="订阅本站更新">RSS 订阅</a>';

mountPlugins();
renderNavTabs();
route();

/* PWA：注册 Service Worker（仅 https 且浏览器支持时；失败静默，不影响站点运行） */
if ("serviceWorker" in navigator && location.protocol === "https:") {
  window.addEventListener("load", function () {
    setTimeout(function () {
      navigator.serviceWorker.register("sw.js")["catch"](function () {});
    }, 1200);
  });
}
});
</script>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DSH 博客</title>
<link rel="icon" href="assets/img/dsh.ico">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0f172a;
    --card: rgba(30, 41, 59, var(--card-opacity, 0.65));  /* 半透明卡片：透明度由 site.js 的 cardOpacity 控制 */
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --accent2: #818cf8;
    --line: rgba(255,255,255,0.08);
    --pink: #f472b6;
    --bg-image: url("assets/background.jpg");
    --bg-dim: 0.6;                       /* 背景图压暗程度 0~1：越大图片越淡、文字越清楚 */
  }

  html { scroll-behavior: smooth; }

  html { background: var(--bg); }

  body {
    font-family: "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif;
    color: var(--text);
    line-height: 1.7;
  }

  /* 全屏固定背景图（站长在文件底部 SITE.background 配置）+ 压暗层，保证内容可读 */
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -2;
    background: var(--bg-image) center / cover no-repeat;
  }
  body::after {
    content: ""; position: fixed; inset: 0; z-index: -1;
    background: rgba(15, 23, 42, var(--bg-dim));
    pointer-events: none;
  }

  /* 动态背景视频（site.js 的 backgroundVideo 配置；未设置时隐藏，用静态背景图） */
  #bgVideo {
    position: fixed; inset: 0; z-index: -2; width: 100%; height: 100%;
    object-fit: cover; display: none;
  }

  a { color: var(--accent); }

  /* ================= 顶部导航（分区切换） ================= */
  nav {
    position: sticky; top: 0; z-index: 20;
    background: rgba(15, 23, 42, 0.75);
    backdrop-filter: blur(var(--card-blur, 0px));
    border-bottom: 1px solid var(--line);
  }
  nav .nav-inner {
    max-width: 1280px; margin: 0 auto; padding: 0 20px;
    display: flex; justify-content: space-between; align-items: center;
    height: 60px; gap: 16px; flex-wrap: wrap;
  }
  .logo { font-weight: 700; font-size: 18px; white-space: nowrap; }
  .logo span { color: var(--accent); }
  .tabs { display: flex; gap: 6px; }
  .tab {
    color: var(--muted); text-decoration: none; font-size: 14px;
    padding: 6px 16px; border-radius: 999px; transition: .2s;
  }
  .tab:hover { color: var(--accent); background: rgba(56,189,248,.08); }
  .tab.active {
    color: #fff;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
  }

  /* ================= 三栏布局 ================= */
  .layout {
    max-width: 1280px; margin: 24px auto 40px; padding: 0 20px;
    display: grid;
    grid-template-columns: 280px minmax(0, 1fr) 280px;
    gap: 24px;
    align-items: start;
  }

  /* ---- 通用卡片 / 小工具 ---- */
  .widget {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 20px; margin-bottom: 20px;
  }

  /* 卡片磨砂程度由 site.js 的 cardBlur 控制：0 = 清晰透出背景，数值越大越磨砂 */
  .widget, .banner, .post-card, .post-detail, .work-card,
  .board-form, .msg-bubble {
    backdrop-filter: blur(var(--card-blur, 0px));
    -webkit-backdrop-filter: blur(var(--card-blur, 0px));
  }
  .widget-title {
    font-size: 15px; font-weight: 700; margin-bottom: 14px;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  .widget-title .ico { margin-right: 6px; }
  .widget-link { font-size: 12px; font-weight: 400; color: var(--muted); text-decoration: none; }
  .widget-link:hover { color: var(--accent); }

  /* ---- 左栏：时钟 ---- */
  .clock-date { color: var(--muted); font-size: 13px; }
  .clock-time {
    font-size: 34px; font-weight: 700; letter-spacing: 2px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .clock-hello { color: var(--muted); font-size: 13px; margin-top: 4px; }

  /* ---- 左栏：一言 ---- */
  .quote-text { font-size: 14px; color: var(--text); min-height: 66px; }
  .quote-from { color: var(--muted); font-size: 12px; text-align: right; margin-top: 8px; }

  /* ---- 左栏：点赞 ---- */
  .like-box { text-align: center; padding: 4px 0; }
  .like-btn {
    width: 64px; height: 64px; border-radius: 50%; border: none; cursor: pointer;
    background: rgba(244,114,182,.12); color: var(--pink); font-size: 28px;
    transition: .2s;
  }
  .like-btn:hover { transform: scale(1.08); }
  .like-btn.done { background: rgba(244,114,182,.25); }
  .like-btn.pop { animation: pop .35s; }
  @keyframes pop { 40% { transform: scale(1.3); } }
  .like-count { font-size: 22px; font-weight: 700; margin-top: 8px; }
  .like-hint { color: var(--muted); font-size: 12px; }

  /* ---- 左栏：快捷留言 ---- */
  .qm-input, .board-form input, .board-form textarea {
    width: 100%; background: rgba(15,23,42,.45); border: 1px solid var(--line);
    border-radius: 8px; color: var(--text); font-family: inherit;
    font-size: 13px; padding: 8px 12px; outline: none; resize: none;
  }
  .qm-input:focus, .board-form input:focus, .board-form textarea:focus { border-color: var(--accent); }
  .qm-area { min-height: 72px; margin-top: 8px; }
  .btn {
    display: inline-block; padding: 8px 22px; border-radius: 8px; border: none;
    font-size: 13px; font-family: inherit; cursor: pointer; text-decoration: none;
    transition: .2s;
  }
  .btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(56,189,248,.35); }
  .btn-block { width: 100%; margin-top: 10px; }
  .qm-golink { display: block; text-align: center; margin-top: 10px; color: var(--muted); font-size: 12px; text-decoration: none; }
  .qm-golink:hover { color: var(--accent); }

  /* ================= 中栏：内容区 ================= */
  .view-head {
    display: flex; justify-content: space-between; align-items: center;
    gap: 12px; margin-bottom: 18px; flex-wrap: wrap;
  }
  .view-title { font-size: 22px; }
  .view-title::after {
    content: ""; display: block; width: 42px; height: 3px; margin-top: 6px;
    background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 2px;
  }
  .search-box { position: relative; }
  .search-box input {
    background: var(--card); border: 1px solid var(--line); border-radius: 999px;
    color: var(--text); font-family: inherit; font-size: 13px;
    padding: 8px 16px 8px 34px; outline: none; width: 220px;
  }
  .search-box input:focus { border-color: var(--accent); }
  .search-box::before {
    content: "🔍"; position: absolute; left: 12px; top: 50%;
    transform: translateY(-50%); font-size: 12px; opacity: .6;
  }

  /* ---- 首页横幅 ---- */
  .banner {
    background: linear-gradient(135deg, rgba(56,189,248,.18), rgba(129,140,248,.18)),
                rgba(30, 41, 59, .45);   /* 暗层打底，透出背景同时保证文字可读 */
    border: 1px solid rgba(56,189,248,.25); border-radius: 12px;
    padding: 28px; margin-bottom: 24px; display: flex; align-items: center; gap: 20px;
  }
  .banner .avatar {
    width: 72px; height: 72px; border-radius: 50%; flex: none;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex; align-items: center; justify-content: center;
    font-size: 28px; font-weight: 700; color: #fff;
  }
  .banner h2 { font-size: 20px; margin-bottom: 4px; }
  .banner p { color: var(--muted); font-size: 14px; }
  .banner .avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block; }
  .banner .site-intro { color: var(--muted); font-size: 13px; margin-top: 6px; max-width: 560px; }
  .banner .chips { margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    font-size: 12px; color: var(--accent); background: rgba(56,189,248,.1);
    border: 1px solid rgba(56,189,248,.25); border-radius: 999px; padding: 2px 12px;
  }

  .sec-head { display: flex; justify-content: space-between; align-items: baseline; margin: 26px 0 14px; }
  .sec-head h3 { font-size: 17px; }
  .sec-head a { font-size: 13px; color: var(--muted); text-decoration: none; }
  .sec-head a:hover { color: var(--accent); }

  /* ---- 文章卡片 ---- */
  .post-card {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 20px 22px; margin-bottom: 16px; transition: .2s;
  }
  .post-card:hover { border-color: rgba(56,189,248,.4); transform: translateY(-2px); }
  .post-card h4 { font-size: 17px; margin-bottom: 8px; }
  .post-card h4 a { color: var(--text); text-decoration: none; }
  .post-card h4 a:hover { color: var(--accent); }
  .post-meta {
    display: flex; gap: 14px; flex-wrap: wrap;
    color: var(--muted); font-size: 12px; margin-bottom: 10px;
  }
  .post-meta .cat {
    color: var(--accent); background: rgba(56,189,248,.1);
    padding: 0 10px; border-radius: 999px;
  }
  .post-sum { color: var(--muted); font-size: 14px; margin-bottom: 12px; }
  .read-more { font-size: 13px; text-decoration: none; }
  .read-more:hover { text-decoration: underline; }

  .filter-tag {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(56,189,248,.12); color: var(--accent);
    border-radius: 999px; padding: 3px 12px; font-size: 13px; margin-bottom: 14px;
  }
  .filter-tag a { text-decoration: none; color: inherit; }
  .empty { color: var(--muted); text-align: center; padding: 40px 0; font-size: 14px; }

  /* ---- 文章详情 ---- */
  .back-link { display: inline-block; color: var(--muted); font-size: 13px; text-decoration: none; margin-bottom: 16px; }
  .back-link:hover { color: var(--accent); }
  .post-detail {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 30px 32px;
  }
  .post-detail h1 { font-size: 26px; line-height: 1.4; margin: 10px 0 14px; }
  .post-content { margin-top: 18px; }
  .post-content p { margin-bottom: 14px; color: var(--text); font-size: 15px; }
  .post-content h3 {
    font-size: 17px; margin: 22px 0 10px; padding-left: 12px;
    border-left: 3px solid var(--accent);
  }
  .post-content img {
    max-width: 100%; display: block; border-radius: 8px;
    margin: 14px auto; border: 1px solid var(--line);
  }
  .post-tags { margin-top: 20px; display: flex; gap: 8px; flex-wrap: wrap; }
  .post-tags a {
    font-size: 12px; color: var(--muted); text-decoration: none;
    border: 1px solid var(--line); border-radius: 999px; padding: 2px 12px;
  }
  .post-tags a:hover { color: var(--accent); border-color: var(--accent); }

  /* ---- 作品详情 ---- */
  .work-hero {
    height: 200px; border-radius: 10px; margin-bottom: 18px;
    display: flex; align-items: center; justify-content: center; font-size: 72px;
    background-size: cover; background-position: center;
  }
  .dl-big {
    display: inline-block; margin: 10px 0 6px; padding: 12px 36px; border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff;
    text-decoration: none; font-size: 15px; transition: .2s;
  }
  .dl-big:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(56,189,248,.4); }

  /* ---- 网站推荐 ---- */
  .link-card {
    display: flex; gap: 14px; align-items: flex-start;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 16px; text-decoration: none; transition: .2s;
    backdrop-filter: blur(var(--card-blur, 0px));
    -webkit-backdrop-filter: blur(var(--card-blur, 0px));
  }
  .link-card:hover { transform: translateY(-4px); border-color: rgba(56,189,248,.4); }
  .link-icon {
    width: 44px; height: 44px; border-radius: 10px; flex: none;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 20px; font-weight: 700;
  }
  .link-card .link-body { flex: 1; min-width: 0; }
  .link-card h4 { color: var(--text); font-size: 15px; margin-bottom: 4px; }
  .link-card p { color: var(--muted); font-size: 13px; margin-bottom: 8px; }
  .link-dom { color: var(--muted); font-size: 12px; }

  /* ---- 作品 ---- */
  .works-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 18px; }
  .work-card {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    overflow: hidden; transition: .2s;
  }
  .work-card:hover { transform: translateY(-4px); border-color: rgba(56,189,248,.4); }
  a.work-cover-link { display: block; text-decoration: none; }
  .work-cover {
    height: 110px; display: flex; align-items: center; justify-content: center;
    font-size: 40px;
    background-size: cover; background-position: center;
  }
  .work-body { padding: 14px 16px 16px; }
  .work-body h4 { font-size: 15px; margin-bottom: 6px; }
  .work-body h4 a { color: var(--text); text-decoration: none; }
  .work-body h4 a:hover { color: var(--accent); }
  .work-body p { color: var(--muted); font-size: 13px; margin-bottom: 10px; }
  .work-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 2px; }
  .work-tag {
    display: inline-block; font-size: 12px; color: var(--accent);
    background: rgba(56,189,248,.1); border-radius: 999px; padding: 1px 10px;
  }
  .work-dl {
    font-size: 12px; color: #fff; text-decoration: none; white-space: nowrap;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    padding: 4px 14px; border-radius: 999px; transition: .2s;
  }
  .work-dl:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(56,189,248,.4); }
  .dl-size { opacity: .85; font-size: 11px; }

  /* ---- 留言板 ---- */
  .board-form {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 20px; margin-bottom: 20px;
  }
  .board-form input { margin-bottom: 10px; }
  .board-form textarea { min-height: 90px; margin-bottom: 10px; }
  .msg-item { display: flex; gap: 12px; margin-bottom: 14px; }
  .msg-avatar {
    width: 38px; height: 38px; border-radius: 50%; flex: none; color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700;
  }
  .msg-bubble {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 4px 12px 12px 12px; padding: 10px 14px; flex: 1;
  }
  .msg-head { display: flex; gap: 10px; align-items: baseline; margin-bottom: 4px; }
  .msg-name { font-size: 14px; font-weight: 700; }
  .msg-time { color: var(--muted); font-size: 12px; }
  .msg-text { font-size: 14px; color: var(--text); }

  /* ================= 右栏：统计类插件 ================= */
  .stat-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 7px 0; font-size: 13px; border-bottom: 1px dashed rgba(255,255,255,.06);
  }
  .stat-row:last-child { border-bottom: none; }
  .stat-row span:first-child { color: var(--muted); }
  .stat-row b { font-size: 15px; color: var(--accent); }

  .hot-list { list-style: none; }
  .hot-list li { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 10px; }
  .hot-rank {
    width: 20px; height: 20px; border-radius: 6px; flex: none; margin-top: 3px;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700; color: #fff; background: rgba(148,163,184,.35);
  }
  .hot-list li:nth-child(1) .hot-rank { background: #f87171; }
  .hot-list li:nth-child(2) .hot-rank { background: #fb923c; }
  .hot-list li:nth-child(3) .hot-rank { background: #facc15; color: #713f12; }
  .hot-list a { color: var(--text); text-decoration: none; font-size: 13px; line-height: 1.5; }
  .hot-list a:hover { color: var(--accent); }
  .hot-views { color: var(--muted); font-size: 11px; }

  .cat-row { margin-bottom: 12px; }
  .cat-row .cat-line { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px; }
  .cat-row .cat-line span:last-child { color: var(--muted); }
  .bar-track { height: 6px; border-radius: 3px; background: rgba(255,255,255,.07); overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--accent), var(--accent2)); }

  .cloud { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }
  .cloud a { color: var(--muted); text-decoration: none; transition: .15s; }
  .cloud a:hover { color: var(--accent); }

  /* ---- 提示气泡 ---- */
  .toast {
    position: fixed; left: 50%; bottom: 36px; transform: translateX(-50%) translateY(20px);
    background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff;
    padding: 10px 26px; border-radius: 999px; font-size: 14px;
    opacity: 0; pointer-events: none; transition: .3s; z-index: 50;
    box-shadow: 0 8px 24px rgba(0,0,0,.4);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  footer {
    text-align: center; padding: 28px 0; color: var(--muted);
    font-size: 13px; border-top: 1px solid var(--line);
  }

  /* ---- 主题切换按钮 ---- */
  .theme-btn {
    width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line);
    background: var(--card); color: var(--text); font-size: 15px; cursor: pointer;
    transition: .2s; flex: none; line-height: 1;
  }
  .theme-btn:hover { border-color: var(--accent); transform: rotate(15deg); }

  /* ---- 亮色主题（html[data-theme="light"] 时整套变量翻转为浅色） ---- */
  html[data-theme="light"] {
    --bg: #f1f5f9;
    --card: rgba(255, 255, 255, var(--card-opacity, 0.65));
    --text: #1e293b;
    --muted: #64748b;
    --accent: #0284c7;
    --accent2: #6366f1;
    --line: rgba(15, 23, 42, 0.12);
    --pink: #db2777;
  }
  html[data-theme="light"] body::after { background: rgba(241, 245, 249, var(--bg-dim)); }
  html[data-theme="light"] nav { background: rgba(255, 255, 255, .78); }
  html[data-theme="light"] .qm-input,
  html[data-theme="light"] .board-form input,
  html[data-theme="light"] .board-form textarea { background: rgba(255, 255, 255, .55); }
  html[data-theme="light"] .bp-body.img-full { background: rgba(255, 255, 255, .5); }

  /* ================= 响应式 ================= */
  @media (max-width: 1120px) {
    .layout { grid-template-columns: 250px minmax(0, 1fr); }
    .col-right {
      grid-column: 1 / -1; display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px;
    }
    .col-right .widget { margin-bottom: 0; }
  }
  @media (max-width: 780px) {
    .layout { grid-template-columns: 1fr; }
    .col-main { order: -1; }
    .banner { flex-direction: column; text-align: center; }
    .banner .chips { justify-content: center; }
    .nav-inner { height: auto; padding-top: 10px; padding-bottom: 10px; justify-content: center; }
    .search-box input { width: 160px; }
  }
</style>
</head>
<body>

<video id="bgVideo" loop muted playsinline preload="none"></video>

<!-- ================= 顶部导航：分区切换 ================= -->
<nav>
  <div class="nav-inner">
    <div class="logo" id="logo"></div>
    <div class="tabs" id="navTabs"></div>
    <button class="theme-btn" id="themeBtn" title="切换亮色主题">☀️</button>
  </div>
</nav>

<div class="layout">

  <!-- ================= 左栏：互动插件（由 plugins/ 目录自动挂载） ================= -->
  <aside class="col-left" id="colLeft"></aside>

  <!-- ================= 中栏：文章 / 作品内容 ================= -->
  <main class="col-main" id="mainView"></main>

  <!-- ================= 右栏：统计插件（由 plugins/ 目录自动挂载） ================= -->
  <aside class="col-right" id="colRight"></aside>

</div>

<footer id="siteFooter"></footer>
<div class="toast" id="toast"></div>

<!-- ================= 站点信息：博客名 / 头像 / 介绍 / 背景图 / 页脚，改 site.js 即可 ================= -->
<script src="site.js?v=4"></script>

<!-- ================= 插件库：一个插件一个文件，升级/更换/下线只动 plugins/ 目录 ================= -->
<script>
  window.BLOG_PLUGINS = [];
  window.registerPlugin = function (def) { BLOG_PLUGINS.push(def); };
</script>
<script src="plugins/clock.js"></script>
<script src="plugins/quote.js"></script>
<script src="plugins/pet.js?v=14"></script>
<script src="plugins/site-stats.js?v=2"></script>
<script src="plugins/hot-posts.js"></script>
<script src="plugins/categories.js"></script>
<script src="plugins/tag-cloud.js"></script>

<!-- ================= 内容库：文章在 content/posts/（一篇一个文件），作品在 content/works.js ================= -->
<script>
  window.BLOG_POSTS = [];
  window.BLOG_WORKS = [];
  // 记录当前执行的 js 文件所在的内容目录（如 content/works/01-dsh-desktop/），
  // 作品/文章里写裸图片文件名时自动定位到自己的文件夹
  function BLOG_scriptDir(base) {
    var s = document.currentScript, m = s && s.src ? s.src.match(/([^\/\\]+?)\.js(?:[?#].*)?$/) : null;
    return m ? base + m[1] + "/" : "";
  }
  window.registerPost = function (def) {
    def._dir = BLOG_scriptDir("content/posts/");
    BLOG_POSTS.push(def);
  };
  window.registerWork = function (def) {
    def._dir = BLOG_scriptDir("content/works/");
    if (def.id == null) def.id = BLOG_WORKS.length ? Math.max.apply(null, BLOG_WORKS.map(function (x) { return x.id || 0; })) + 1 : 1;
    BLOG_WORKS.push(def);
  };
  window.BLOG_SITES = [];
  window.registerSite = function (def) { BLOG_SITES.push(def); };
</script>

<script>
/* ================= 站点配置（在 site.js 文件里修改） ================= */
const SITE = Object.assign({
  name: "DSH",
  tagline: "",
  intro: "",
  avatar: "",
  background: "assets/background.png",
  backgroundDim: 0.6,
  footer: "© 2026 DSH 的博客 · 由 GitHub Pages 免费托管",
}, window.BLOG_SITE || {});

/* ================= 文章数据（存放在 content/posts/ 目录，一篇一个文件） ================= */
const ARTICLES = window.BLOG_POSTS || [];

/* ================= 作品数据（存放在 content/works.js） ================= */
const WORKS = window.BLOG_WORKS || [];

/* ================= 本地存储工具 ================= */
function storeGet(key, fallback) {
  try { const v = JSON.parse(localStorage.getItem(key)); return v === null || v === undefined ? fallback : v; }
  catch (e) { return fallback; }
}
function storeSet(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {} }

const state = {
  visits: 0,
  likes: storeGet("dsh_likes", 0),
  liked: storeGet("dsh_liked", false),
  viewExtra: storeGet("dsh_views", {}),   // 每篇文章的额外浏览量
};

function articleViews(id) {
  const a = ARTICLES.find(x => x.id === id);
  return (a ? a.views : 0) + (state.viewExtra[id] || 0);
}

/* ================= 顶部 Logo ================= */
document.getElementById("logo").innerHTML =
  SITE.name + "<span>.blog</span> · " + SITE.tagline;
document.title = SITE.name + " 博客";
document.getElementById("siteFooter").textContent = SITE.footer;
document.documentElement.style.setProperty("--bg-image", 'url("' + SITE.background + '")');
document.documentElement.style.setProperty("--bg-dim", String(SITE.backgroundDim));
if (SITE.cardOpacity != null) document.documentElement.style.setProperty("--card-opacity", String(SITE.cardOpacity));
if (SITE.cardBlur != null) document.documentElement.style.setProperty("--card-blur", String(SITE.cardBlur));
/* 视频背景体积大：移动端不加载（用静态背景图），桌面端也等页面加载完再拉，首屏不被大视频阻塞 */
if (SITE.backgroundVideo) {
  var bgV = document.getElementById("bgVideo");
  if (window.matchMedia("(min-width: 781px)").matches) {
    var bgEnable = function () {
      bgV.src = SITE.backgroundVideo;
      bgV.style.display = "block";
      var bgPlay = bgV.play();
      if (bgPlay && bgPlay.catch) bgPlay.catch(function () {});
    };
    if (document.readyState === "complete") bgEnable();
    else window.addEventListener("load", bgEnable);
  }
}

/* ================= 工具函数 ================= */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

/* 图片路径解析：裸文件名 → 该作品/文章自己的文件夹；
   assets/ 开头、/ 开头、http(s) 链接原样保留 */
function resolveAsset(owner, path) {
  if (!path || /^(https?:|data:|\/\/)/i.test(path) || path.charAt(0) === "/" || path.indexOf("assets/") === 0) return path;
  return (owner && owner._dir ? owner._dir : "") + path;
}
function resolveDetailImgs(owner, html) {
  return String(html || "").replace(/(<img\b[^>]*\ssrc=")([^"]+)(")/g,
    (all, pre, src, post) => pre + resolveAsset(owner, src) + post);
}

function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove("show"), 2200);
}

function fmtNow() {
  const d = new Date(), p = n => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) +
         " " + p(d.getHours()) + ":" + p(d.getMinutes());
}

/* ================= 插件系统：挂载与刷新（插件本体在 plugins/ 目录） ================= */
const CTX = {
  SITE, ARTICLES, WORKS, state, articleViews, esc, toast, fmtNow, storeGet, storeSet,
  refreshPlugins: () => refreshPlugins(),
};

function mountPlugins() {
  const cols = { left: $("colLeft"), right: $("colRight") };
  BLOG_PLUGINS
    .filter(p => p.enabled !== false)
    .sort((a, b) => (a.order || 50) - (b.order || 50))
    .forEach(p => {
      const floating = p.column === "float";   // 浮动插件（如桌宠）：挂在 body 上，不进左右栏
      const host = floating ? document.body : (cols[p.column] || cols.left);
      const card = document.createElement("div");
      card.className = floating
        ? ("blog-pet " + (p.className || "")).trim()
        : "widget" + (p.className ? " " + p.className : "");
      card.dataset.plugin = p.id;
      host.appendChild(card);
      p._el = card;
      try {
        p.render(card, CTX);
        if (p.init) p.init(card, CTX);
      } catch (err) {
        card.innerHTML = '<div class="widget-title"><span><span class="ico">⚠️</span>插件 ' +
          esc(p.id) + ' 加载失败</span></div>';
      }
    });
}

function refreshPlugins() {
  BLOG_PLUGINS.forEach(p => {
    if (p.enabled === false || !p.live || !p._el) return;
    try { p.render(p._el, CTX); } catch (err) {}
  });
}

/* ================= 访问量统计 ================= */
state.visits = storeGet("dsh_visits", 0) + 1;
storeSet("dsh_visits", state.visits);

/* ================= 中栏：视图渲染 ================= */
const mainView = $("mainView");

function postCard(a) {
  return '<article class="post-card">' +
    '<h4><a href="#/post/' + a.id + '">' + esc(a.title) + '</a></h4>' +
    '<div class="post-meta"><span class="cat">' + esc(a.category) + '</span>' +
    '<span>📅 ' + a.date + '</span><span>👀 ' + articleViews(a.id) + ' 浏览</span></div>' +
    '<p class="post-sum">' + esc(a.summary) + '</p>' +
    '<a class="read-more" href="#/post/' + a.id + '">阅读全文 →</a></article>';
}

  function workCard(w) {
    const link = "#/work/" + (w.id != null ? w.id : "");
    const dl = w.file
      ? '<a class="work-dl" href="' + esc(w.file) + '"' +
        (/^https?:/i.test(w.file) ? ' target="_blank" rel="noopener"' : ' download') +
        '>⬇ 下载' + (w.version ? ' ' + esc(w.version) : '') +
        (w.size ? ' <span class="dl-size">' + esc(w.size) + '</span>' : '') + '</a>'
      : '';
    const coverStyle = w.coverImg
      ? "background-image:url('" + resolveAsset(w, w.coverImg) + "')"
      : "background:" + w.cover;
    const coverInner = w.coverImg ? "" : w.emoji;
    return '<div class="work-card">' +
      '<a class="work-cover-link" href="' + link + '"><div class="work-cover" style="' + coverStyle + '">' + coverInner + '</div></a>' +
      '<div class="work-body"><h4><a href="' + link + '">' + esc(w.title) + '</a></h4><p>' + esc(w.desc) + '</p>' +
      '<div class="work-foot"><span class="work-tag">' + esc(w.tag) + '</span>' + dl + '</div></div></div>';
  }

/* ---- 首页 ---- */
function renderHome() {
  const latest = ARTICLES.slice().sort((a, b) => b.date.localeCompare(a.date)).slice(0, 3);
  const avatarHtml = SITE.avatar
    ? '<img src="' + esc(SITE.avatar) + '" alt="头像">'
    : esc((SITE.name || "博")[0]);
  mainView.innerHTML =
    '<div class="banner">' +
      '<div class="avatar">' + avatarHtml + '</div>' +
      '<div><h2>你好，我是 ' + esc(SITE.name) + '</h2>' +
      '<p>' + esc(SITE.tagline) + '</p>' +
      (SITE.intro ? '<p class="site-intro">' + esc(SITE.intro) + '</p>' : '') +
      '<div class="chips"><span class="chip">文章 ' + ARTICLES.length + '</span>' +
      '<span class="chip">作品 ' + WORKS.length + '</span></div></div>' +
    '</div>' +
    '<div class="sec-head"><h3>📝 最新文章</h3><a href="#/articles">查看全部 →</a></div>' +
    latest.map(postCard).join("") +
    '<div class="sec-head"><h3>🚀 最新作品</h3><a href="#/works">查看全部 →</a></div>' +
    '<div class="works-grid">' + WORKS.slice(0, 4).map(workCard).join("") + '</div>';
}

/* ---- 文章列表 ---- */
let articleKeyword = "";

function renderArticleList(tagFilter) {
  const box = $("articleListBox");
  if (!box) return;
  const kw = articleKeyword.trim().toLowerCase();
  const list = ARTICLES.filter(a =>
    (!tagFilter || a.tags.includes(tagFilter) || a.category === tagFilter) &&
    (!kw || a.title.toLowerCase().includes(kw) || a.summary.toLowerCase().includes(kw) || a.tags.join(",").toLowerCase().includes(kw))
  ).sort((a, b) => b.date.localeCompare(a.date));
  box.innerHTML = list.length
    ? list.map(postCard).join("")
    : '<div class="empty">没有找到符合条件的文章</div>';
}

function renderArticles(tagFilter) {
  mainView.innerHTML =
    '<div class="view-head"><h2 class="view-title">✍️ 全部文章</h2>' +
    '<div class="search-box"><input id="articleSearch" placeholder="搜索文章…" value="' + esc(articleKeyword) + '"></div></div>' +
    (tagFilter ? '<div class="filter-tag">标签筛选：' + esc(tagFilter) + ' <a href="#/articles" title="清除筛选">✕</a></div>' : "") +
    '<div id="articleListBox"></div>';
  renderArticleList(tagFilter);
  $("articleSearch").addEventListener("input", function () {
    articleKeyword = this.value;
    renderArticleList(tagFilter);
  });
}

/* ---- 文章详情 ---- */
function renderPost(id) {
  const a = ARTICLES.find(x => x.id === id);
  if (!a) { renderArticles(); return; }
  state.viewExtra[id] = (state.viewExtra[id] || 0) + 1;
  storeSet("dsh_views", state.viewExtra);
  refreshPlugins();
  mainView.innerHTML =
    '<a class="back-link" href="#/articles">← 返回文章列表</a>' +
    '<article class="post-detail">' +
    '<div class="post-meta"><span class="cat">' + esc(a.category) + '</span>' +
    '<span>📅 ' + a.date + '</span><span>👀 ' + articleViews(id) + ' 浏览</span></div>' +
    '<h1>' + esc(a.title) + '</h1>' +
    '<div class="post-content">' + resolveDetailImgs(a, a.content) + '</div>' +
    '<div class="post-tags">' + a.tags.map(t =>
      '<a href="#/articles/tag/' + encodeURIComponent(t) + '">#' + esc(t) + '</a>').join("") + '</div>' +
    '</article>';
}

/* ---- 作品 ---- */
function renderWorks() {
  mainView.innerHTML =
    '<div class="view-head"><h2 class="view-title">🚀 我的作品</h2></div>' +
    '<div class="works-grid">' + WORKS.map(workCard).join("") + '</div>';
}

/* ---- 作品详情 ---- */
function renderWork(id) {
  const w = WORKS.find(x => x.id === id);
  if (!w) { renderWorks(); return; }
  const meta = ['<span class="cat">' + esc(w.tag) + '</span>'];
  if (w.version) meta.push('<span>🔖 ' + esc(w.version) + '</span>');
  if (w.date) meta.push('<span>📅 ' + esc(w.date) + '</span>');
  if (w.size) meta.push('<span>📦 ' + esc(w.size) + '</span>');
  const dl = w.file
    ? '<a class="dl-big" href="' + esc(w.file) + '"' +
      (/^https?:/i.test(w.file) ? ' target="_blank" rel="noopener"' : ' download') +
      '>⬇ 立即下载' + (w.version ? ' ' + esc(w.version) : '') + '</a>' +
      '<div class="post-meta" style="margin:4px 0 0;">' +
      (/^https?:/i.test(w.file) ? '<span>外部链接，将在新窗口打开</span>' : '<span>文件位置：' + esc(w.file) + '</span>') + '</div>'
    : '';
  mainView.innerHTML =
    '<a class="back-link" href="#/works">← 返回作品列表</a>' +
    '<article class="post-detail">' +
    '<div class="work-hero" style="' + (w.coverImg
      ? "background-image:url('" + resolveAsset(w, w.coverImg) + "')"
      : "background:" + w.cover) + '">' + (w.coverImg ? "" : w.emoji) + '</div>' +
    '<h1>' + esc(w.title) + '</h1>' +
    '<div class="post-meta">' + meta.join("") + '</div>' +
    dl +
    '<div class="post-content"><p>' + esc(w.desc) + '</p>' + resolveDetailImgs(w, w.detail) + '</div>' +
    '</article>';
}

/* ---- 扩展分区（views/ 目录注册的模块，如留言板）由路由统一分发 ---- */

/* ================= Hash 路由 ================= */
function setActiveTab(view) {
  document.querySelectorAll(".tab").forEach(t =>
    t.classList.toggle("active", t.dataset.view === view));
}

function route() {
  const hash = location.hash.replace(/^#\/?/, "");
  const parts = hash.split("/").filter(Boolean).map(decodeURIComponent);
  const view = parts[0] || "home";
  articleKeyword = "";
  if (view === "post" && parts[1]) { setActiveTab("articles"); renderPost(Number(parts[1])); }
  else if (view === "articles") { setActiveTab("articles"); renderArticles(parts[1] === "tag" ? parts[2] : null); }
  else if (view === "work" && parts[1]) { setActiveTab("works"); renderWork(Number(parts[1])); }
  else if (view === "works") { setActiveTab("works"); renderWorks(); }
  else {
    const sec = BLOG_SECTIONS.find(s => s.id === view);
    if (sec) { setActiveTab(sec.id); sec.render(mainView, CTX); }
    else { setActiveTab("home"); renderHome(); }
  }
  window.scrollTo(0, 0);
}

window.addEventListener("hashchange", route);

/* ================= 顶部导航：内置分区 + views/ 扩展分区自动生成 ================= */
function renderNavTabs() {
  const items = [
    { id: "home", label: "首页", order: 10 },
    { id: "articles", label: "文章", order: 20 },
    { id: "works", label: "作品", order: 30 },
  ].concat(BLOG_SECTIONS)
   .sort((a, b) => (a.order || 50) - (b.order || 50));
  $("navTabs").innerHTML = items.map(i =>
    '<a class="tab" data-view="' + i.id + '" href="#/' + i.id + '">' + i.label + '</a>').join("");
}

/* ================= 亮/暗主题切换（选择存访客本地，默认暗色） ================= */
function applyTheme(t) {
  document.documentElement.setAttribute("data-theme", t);
  const btn = $("themeBtn");
  if (btn) {
    btn.textContent = t === "light" ? "🌙" : "☀️";
    btn.title = t === "light" ? "切换到暗色主题" : "切换到亮色主题";
  }
  /* 留言板 giscus iframe 跟随主题（transparent_dark 透明底适合本站暗色） */
  const gf = document.querySelector("iframe.giscus-beta");
  if (gf) gf.contentWindow.postMessage(
    { giscus: { setConfig: { theme: t === "light" ? "noborder_light" : "transparent_dark" } } },
    "https://giscus.app");
}
let theme = storeGet("dsh_theme", "dark");
applyTheme(theme);
$("themeBtn").addEventListener("click", function () {
  theme = theme === "light" ? "dark" : "light";
  storeSet("dsh_theme", theme);
  applyTheme(theme);
});

/* ================= 启动 ================= */
mountPlugins();
renderNavTabs();
route();
</script>
